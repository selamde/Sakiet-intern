<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Glow -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#glowGrad)" stroke-width="3" filter="url(#softGlow)" stroke-dasharray="10 6" />
  <circle cx="200" cy="200" r="140" fill="#131B2E" />

  <!-- Grid Pattern Overlay in circle -->
  <g opacity="0.15">
    <line x1="80" y1="120" x2="320" y2="120" stroke="#818CF8" stroke-width="1" />
    <line x1="80" y1="160" x2="320" y2="160" stroke="#818CF8" stroke-width="1" />
    <line x1="80" y1="200" x2="320" y2="200" stroke="#818CF8" stroke-width="1" />
    <line x1="80" y1="240" x2="320" y2="240" stroke="#818CF8" stroke-width="1" />
    <line x1="80" y1="280" x2="320" y2="280" stroke="#818CF8" stroke-width="1" />
    <line x1="120" y1="80" x2="120" y2="320" stroke="#818CF8" stroke-width="1" />
    <line x1="160" y1="80" x2="160" y2="320" stroke="#818CF8" stroke-width="1" />
    <line x1="200" y1="80" x2="200" y2="320" stroke="#818CF8" stroke-width="1" />
    <line x1="240" y1="80" x2="240" y2="320" stroke="#818CF8" stroke-width="1" />
    <line x1="280" y1="80" x2="280" y2="320" stroke="#818CF8" stroke-width="1" />
  </g>

  <!-- Developer Illustration -->
  <!-- Shoulders & Hoodie -->
  <path d="M110 340 C110 270 140 250 200 250 C260 250 290 270 290 340 Z" fill="url(#jacketGrad)" />
  <!-- Hoodie details -->
  <path d="M165 255 L200 295 L235 255 Z" fill="#1E1B4B" opacity="0.8" />
  <path d="M200 250 L200 340" stroke="#6366F1" stroke-width="2" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="182" y="215" width="36" height="45" rx="10" fill="#E29578" />

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="50" ry="56" fill="#F0A38B" />

  <!-- Hair -->
  <path d="M150 170 C145 130 170 115 200 115 C235 115 255 130 250 170 C245 145 235 135 200 135 C165 135 155 145 150 170 Z" fill="url(#hairGrad)" />
  <path d="M148 165 C146 140 170 120 200 120 C225 120 248 135 252 165 C256 150 245 125 210 125 C175 125 152 145 148 165 Z" fill="#0F172A" />

  <!-- Modern Glasses -->
  <rect x="162" y="166" width="30" height="22" rx="6" fill="#0B0F19" stroke="#6366F1" stroke-width="3" />
  <rect x="208" y="166" width="30" height="22" rx="6" fill="#0B0F19" stroke="#6366F1" stroke-width="3" />
  <line x1="192" y1="177" x2="208" y2="177" stroke="#6366F1" stroke-width="3" />
  <line x1="150" y1="174" x2="162" y2="174" stroke="#6366F1" stroke-width="2" />
  <line x1="238" y1="174" x2="250" y2="174" stroke="#6366F1" stroke-width="2" />

  <!-- Glasses Reflection -->
  <line x1="168" y1="171" x2="182" y2="183" stroke="#818CF8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <line x1="214" y1="171" x2="228" y2="183" stroke="#818CF8" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Smile -->
  <path d="M188 212 Q200 220 212 212" stroke="#B45309" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Headphones -->
  <path d="M142 160 C140 125 160 95 200 95 C240 95 260 125 258 160" fill="none" stroke="#A855F7" stroke-width="6" stroke-linecap="round" />
  <rect x="135" y="155" width="14" height="32" rx="7" fill="#6366F1" />
  <rect x="251" y="155" width="14" height="32" rx="7" fill="#6366F1" />

  <!-- Code elements floating -->
  <g transform="translate(60, 100)">
    <rect width="60" height="30" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5" />
    <text x="30" y="20" fill="#A5B4FC" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;code&gt;</text>
  </g>
  <g transform="translate(280, 240)">
    <rect width="64" height="30" rx="8" fill="#1E1B4B" stroke="#22D3EE" stroke-width="1.5" />
    <text x="32" y="20" fill="#67E8F9" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">{ dev: true }</text>
  </g>
  <g transform="translate(280, 100)">
    <circle cx="20" cy="20" r="16" fill="#1E1B4B" stroke="#A855F7" stroke-width="1.5" />
    <text x="20" y="25" fill="#C084FC" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">JS</text>
  </g>
</svg>
