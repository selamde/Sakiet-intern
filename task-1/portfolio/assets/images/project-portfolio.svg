<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="600" height="360" fill="url(#portBg)" rx="16" />

  <!-- Browser Header Bar -->
  <rect width="600" height="42" fill="#111827" rx="16" />
  <rect y="26" width="600" height="16" fill="#111827" />
  <line x1="0" y1="42" x2="600" y2="42" stroke="#1F2937" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5" fill="#EF4444" />
  <circle cx="42" cy="21" r="5" fill="#F59E0B" />
  <circle cx="60" cy="21" r="5" fill="#10B981" />

  <!-- Search/URL Bar -->
  <rect x="90" y="10" width="300" height="22" rx="6" fill="#1F2937" />
  <text x="110" y="25" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">https://nebyou-developer.portfolio.dev</text>

  <!-- Navbar Simulation -->
  <g transform="translate(24, 56)">
    <text x="0" y="20" fill="#818CF8" font-family="monospace" font-size="16" font-weight="bold">&lt;<tspan fill="#FFFFFF">Nebyou</tspan>/&gt;</text>
    <text x="240" y="20" fill="#C7D2FE" font-family="sans-serif" font-size="11">Home</text>
    <text x="290" y="20" fill="#94A3B8" font-family="sans-serif" font-size="11">About</text>
    <text x="345" y="20" fill="#94A3B8" font-family="sans-serif" font-size="11">Skills</text>
    <text x="395" y="20" fill="#94A3B8" font-family="sans-serif" font-size="11">Projects</text>
    <rect x="460" y="4" width="92" height="26" rx="6" fill="#6366F1" />
    <text x="506" y="21" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Let's Talk</text>
  </g>

  <!-- Hero Section Split (Left text, Right Code Visual) -->
  <!-- Left Side -->
  <g transform="translate(24, 115)">
    <!-- Pill Badge -->
    <rect width="180" height="24" rx="12" fill="#1E1B4B" stroke="#4338CA" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#10B981" />
    <text x="26" y="16" fill="#A5B4FC" font-family="sans-serif" font-size="10" font-weight="600">Available For Work</text>

    <!-- Main headline -->
    <text x="0" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">Hi, I'm <tspan fill="url(#heroGradient)">Nebyou</tspan></text>
    <text x="0" y="80" fill="#E2E8F0" font-family="sans-serif" font-size="14" font-weight="600">Frontend Engineer</text>
    <text x="0" y="104" fill="#94A3B8" font-family="sans-serif" font-size="11">Building fast, accessible &amp; responsive</text>
    <text x="0" y="120" fill="#94A3B8" font-family="sans-serif" font-size="11">modern web applications.</text>

    <!-- CTAs -->
    <rect x="0" y="145" width="108" height="32" rx="8" fill="url(#heroGradient)" />
    <text x="54" y="166" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">View Projects</text>

    <rect x="118" y="145" width="95" height="32" rx="8" fill="transparent" stroke="#475569" stroke-width="1.5" />
    <text x="165" y="166" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Contact</text>
  </g>

  <!-- Right Side: Glowing Code Card -->
  <g transform="translate(290, 110)">
    <rect width="286" height="225" rx="12" fill="url(#codeGrad)" stroke="#6366F1" stroke-width="1.5" />
    
    <!-- Code Editor Tab Bar -->
    <rect width="286" height="30" rx="12" fill="#111827" />
    <rect y="18" width="286" height="12" fill="#111827" />
    <circle cx="18" cy="15" r="4" fill="#EF4444" />
    <circle cx="32" cy="15" r="4" fill="#F59E0B" />
    <circle cx="46" cy="15" r="4" fill="#10B981" />
    <text x="143" y="19" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">Developer.js</text>

    <!-- Code text -->
    <text x="16" y="52" fill="#F43F5E" font-family="monospace" font-size="10">const <tspan fill="#38BDF8">developer</tspan> <tspan fill="#FFF">=</tspan> {</text>
    
    <text x="28" y="74" fill="#C084FC" font-family="monospace" font-size="10">name: <tspan fill="#FDE047">'Nebyou'</tspan>,</text>
    <text x="28" y="96" fill="#C084FC" font-family="monospace" font-size="10">role: <tspan fill="#FDE047">'Frontend Engineer'</tspan>,</text>
    <text x="28" y="118" fill="#C084FC" font-family="monospace" font-size="10">skills: [<tspan fill="#34D399">'HTML'</tspan>, <tspan fill="#34D399">'CSS'</tspan>, <tspan fill="#34D399">'JS'</tspan>],</text>
    <text x="28" y="140" fill="#C084FC" font-family="monospace" font-size="10">styling: <tspan fill="#FDE047">'Tailwind CSS'</tspan>,</text>
    <text x="28" y="162" fill="#C084FC" font-family="monospace" font-size="10">responsive: <tspan fill="#60A5FA">true</tspan>,</text>
    <text x="28" y="184" fill="#C084FC" font-family="monospace" font-size="10">passion: <tspan fill="#FDE047">'Pixel Perfection'</tspan></text>
    
    <text x="16" y="206" fill="#F43F5E" font-family="monospace" font-size="10">};</text>
  </g>
</svg>
