<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="weathBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c192c" />
      <stop offset="100%" stop-color="#070c14" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="600" height="360" fill="url(#weathBg)" rx="16" />

  <!-- Browser Header Bar -->
  <rect width="600" height="42" fill="#111827" rx="16" />
  <rect y="26" width="600" height="16" fill="#111827" />
  <line x1="0" y1="42" x2="600" y2="42" stroke="#1F2937" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5" fill="#EF4444" />
  <circle cx="42" cy="21" r="5" fill="#F59E0B" />
  <circle cx="60" cy="21" r="5" fill="#10B981" />

  <!-- Search/URL Bar -->
  <rect x="90" y="10" width="300" height="22" rx="6" fill="#1F2937" />
  <text x="110" y="25" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">https://atmosphere-pulse.app/weather</text>

  <!-- Weather Hero Display -->
  <g transform="translate(30, 65)">
    <text x="0" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold">San Francisco, CA</text>
    <text x="0" y="44" fill="#94A3B8" font-family="sans-serif" font-size="12">Partly Cloudy • Humidity 64%</text>

    <!-- Large Temp -->
    <text x="0" y="115" fill="#F8FAFC" font-family="sans-serif" font-size="54" font-weight="800">72°<tspan font-size="28" fill="#38BDF8">F</tspan></text>

    <!-- Weather icon art -->
    <circle cx="340" cy="85" r="38" fill="url(#sunGrad)" />
    <!-- cloud in front -->
    <path d="M300 110 C290 110 280 100 280 90 C280 80 290 70 300 70 C305 60 320 52 335 55 C350 45 375 52 380 70 C395 72 405 85 400 100 C405 110 395 110 390 110 Z" fill="#E2E8F0" opacity="0.9" />
  </g>

  <!-- Forecast Row (4 cards) -->
  <g transform="translate(30, 205)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="124" height="120" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="62" y="24" fill="#CBD5E1" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Today</text>
    <circle cx="62" cy="55" r="16" fill="#FBBF24" />
    <text x="62" y="98" fill="#F1F5F9" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">74° / 58°</text>

    <!-- Card 2 -->
    <rect x="138" y="0" width="124" height="120" rx="10" fill="#1E293B" stroke="#4F46E5" stroke-width="1" />
    <text x="200" y="24" fill="#CBD5E1" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Thu</text>
    <circle cx="200" cy="55" r="16" fill="#38BDF8" />
    <text x="200" y="98" fill="#F1F5F9" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">68° / 54°</text>

    <!-- Card 3 -->
    <rect x="276" y="0" width="124" height="120" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="338" y="24" fill="#CBD5E1" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Fri</text>
    <circle cx="338" cy="55" r="16" fill="#A855F7" />
    <text x="338" y="98" fill="#F1F5F9" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">70° / 55°</text>

    <!-- Card 4 -->
    <rect x="414" y="0" width="124" height="120" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="476" y="24" fill="#CBD5E1" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Sat</text>
    <circle cx="476" cy="55" r="16" fill="#F97316" />
    <text x="476" y="98" fill="#F1F5F9" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">76° / 60°</text>
  </g>
</svg>
