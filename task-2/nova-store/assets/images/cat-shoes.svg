<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="shoesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sneakerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="emeraldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#shoesBg)" rx="20" />
  <circle cx="300" cy="320" r="210" fill="#065f46" opacity="0.25" />

  <!-- Sneaker Silhouette (Side Profile) -->
  <g transform="translate(100, 220)">
    <!-- Sole -->
    <path d="M40 230 C120 230 280 230 360 210 C370 218 365 240 330 245 C240 248 100 248 35 245 C25 242 25 230 40 230 Z" fill="#ffffff" />
    <path d="M45 240 L350 240" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
    <!-- Upper shoe -->
    <path d="M40 230 C30 190 70 120 130 110 C160 105 180 140 240 160 C290 170 330 185 360 210 C340 215 150 220 40 230 Z" fill="url(#sneakerBody)" />
    <!-- Shoe Collar / Ankle Opening -->
    <path d="M110 115 C130 95 160 95 180 140" stroke="#047857" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- Dynamic Accent Swoosh / Stripe -->
    <path d="M80 185 Q170 140 270 185" stroke="url(#emeraldAcc)" stroke-width="12" fill="none" stroke-linecap="round" />
    <!-- Laces -->
    <line x1="160" y1="130" x2="190" y2="140" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="145" x2="210" y2="155" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="200" y1="160" x2="230" y2="170" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <!-- Air vents -->
    <circle cx="310" cy="195" r="3" fill="#94a3b8" />
    <circle cx="320" cy="197" r="3" fill="#94a3b8" />
    <circle cx="330" cy="200" r="3" fill="#94a3b8" />
  </g>

  <!-- Tag overlay -->
  <rect x="200" y="615" width="200" height="44" rx="22" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="300" y="643" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">FOOTWEAR &amp; SHOES</text>
</svg>
