<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="roseSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#heroGradient)" rx="24" />

  <!-- Geometric Luxury Shapes -->
  <circle cx="600" cy="300" r="240" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
  <circle cx="600" cy="300" r="180" fill="#1e1b4b" opacity="0.35" />
  <circle cx="600" cy="300" r="120" fill="url(#goldSheen)" opacity="0.15" />

  <!-- High Fashion Editorial Silhouettes -->
  <!-- Female High Fashion Silhouette -->
  <g transform="translate(480, 100)">
    <!-- Hat -->
    <ellipse cx="120" cy="80" rx="90" ry="22" fill="#090d16" stroke="url(#goldSheen)" stroke-width="2" />
    <path d="M70 75 Q120 20 170 75 Z" fill="#090d16" />
    <!-- Neck -->
    <path d="M112 90 L114 140 L126 140 L128 90 Z" fill="#d97706" opacity="0.8" />
    <!-- Trench Coat Silhouette -->
    <path d="M70 140 L120 130 L170 140 L210 440 L30 440 Z" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    <path d="M90 140 L120 250 L150 140 Z" fill="#1e293b" />
    <!-- Belt -->
    <rect x="50" y="270" width="140" height="16" rx="4" fill="url(#goldSheen)" />
    <!-- Scarf / Stole Flow -->
    <path d="M140 140 Q220 220 190 350 Q170 420 200 450" stroke="#f43f5e" stroke-width="12" fill="none" stroke-linecap="round" />
  </g>

  <!-- Male High Fashion Silhouette -->
  <g transform="translate(280, 120)">
    <!-- Head -->
    <circle cx="100" cy="60" r="30" fill="#090d16" stroke="#334155" stroke-width="2" />
    <!-- Overcoat -->
    <path d="M50 110 L100 100 L150 110 L180 430 L20 430 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M80 110 L100 240 L120 110 Z" fill="#090d16" />
    <!-- Lapel Accent -->
    <line x1="50" y1="110" x2="100" y2="240" stroke="url(#goldSheen)" stroke-width="2" />
    <line x1="150" y1="110" x2="100" y2="240" stroke="url(#goldSheen)" stroke-width="2" />
  </g>

  <!-- Floating Cards & Highlights -->
  <!-- Card 1: 2026 Collection -->
  <g transform="translate(60, 130)">
    <rect width="210" height="85" rx="16" fill="#0f172a" stroke="url(#goldSheen)" stroke-width="1.5" opacity="0.95" />
    <circle cx="36" cy="42" r="18" fill="url(#goldSheen)" />
    <text x="36" y="47" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">★</text>
    <text x="70" y="38" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" letter-spacing="1">PARIS &amp; MILAN</text>
    <text x="70" y="58" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold">Autumn '26 Drop</text>
  </g>

  <!-- Card 2: Premium Quality -->
  <g transform="translate(60, 390)">
    <rect width="200" height="80" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.95" />
    <circle cx="36" cy="40" r="18" fill="#10b981" />
    <text x="36" y="45" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✓</text>
    <text x="70" y="36" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">100% ORGANIC</text>
    <text x="70" y="56" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold">Italian Fabrics</text>
  </g>
</svg>
