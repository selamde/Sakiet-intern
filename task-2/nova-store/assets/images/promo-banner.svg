<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="promoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#promoBg)" rx="24" />
  
  <!-- Subtle decorative rings -->
  <circle cx="1050" cy="200" r="280" fill="none" stroke="#312e81" stroke-width="2" opacity="0.6" />
  <circle cx="1050" cy="200" r="200" fill="none" stroke="#4338ca" stroke-width="1.5" opacity="0.4" />
  <circle cx="1050" cy="200" r="120" fill="url(#goldGleam)" opacity="0.1" />

  <!-- Promo Badges and artwork on right -->
  <g transform="translate(950, 110)">
    <circle cx="90" cy="90" r="85" fill="#1e1b4b" stroke="url(#goldGleam)" stroke-width="4" />
    <text x="90" y="75" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" text-anchor="middle">UP TO</text>
    <text x="90" y="120" fill="url(#goldGleam)" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" text-anchor="middle">40%</text>
    <text x="90" y="145" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3">OFF STOREWIDE</text>
  </g>

  <!-- Stars spark -->
  <path d="M780 100 L785 120 L805 125 L785 130 L780 150 L775 130 L755 125 L775 120 Z" fill="#fbbf24" />
  <path d="M860 270 L863 285 L878 288 L863 291 L860 305 L857 291 L842 288 L857 285 Z" fill="#fbbf24" opacity="0.7" />
  <path d="M1100 80 L1103 95 L1118 98 L1103 101 L1100 115 L1097 101 L1082 98 L1097 95 Z" fill="#fbbf24" opacity="0.7" />
</svg>
